<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Pick the credit card with the longest interest-free period for any day, track limits and never miss a due date.">
<meta name="theme-color" content="#1a2330">
<title>Card Float</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='7' width='28' height='18' rx='4' fill='%231a2330'/%3E%3Crect x='6' y='12' width='7' height='5' rx='1.2' fill='%23c29b52'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --bg: #edf0f3;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5b6672;
    --line: #dde2e7;
    --stage: #1a2330;
    --stage-ink: #eef1f4;
    --stage-muted: #9aa6b4;
    --stage-line: rgba(255,255,255,0.10);
    --brass: #c29b52;
    --brass-ink: #86621f;
    --good: #1d7a5c;
    --warn: #9a6410;
    --due: #b3433a;
    --due-bg: #f8e9e7;
    --t1: #d9eee4; --t2: #f1eedc; --t3: #f6e3e0;
    --font: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1217; --surface: #161b22; --ink: #e7ebef; --muted: #98a3af; --line: #262d36;
      --stage: #131a24; --brass-ink: #d7b46e;
      --good: #5cc49a; --warn: #d9a54a; --due: #e5776b; --due-bg: #2a1715;
      --t1: #15291f; --t2: #26241a; --t3: #2c1a18;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font);
    font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  body { min-height: 100vh; padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 0 16px; }

  /* ---------- top bar ---------- */
  .top { background: var(--stage); color: var(--stage-ink); padding: max(14px, env(safe-area-inset-top)) 0 14px; }
  body:not([data-tab="planner"]) .top { border-radius: 0 0 24px 24px; margin-bottom: 22px; }
  .top .wrap { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
  .brand svg { width: 26px; height: 18px; }
  .today { font-size: 13px; color: var(--stage-muted); }

  /* ---------- planner stage ---------- */
  .stage { background: var(--stage); color: var(--stage-ink); border-radius: 0 0 28px 28px; padding: 6px 0 22px; margin-bottom: 22px; }
  .stage-title { font-size: clamp(22px, 6.4vw, 28px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin: 4px 0 16px; }
  .stage-title span { display: block; font-size: 14px; font-weight: 500; color: var(--stage-muted); letter-spacing: 0; margin-top: 4px; }

  .pcard { --c1: #22345a; --c2: #0a1020; --rx: 0deg; --ry: 0deg; --mx: 30%; --my: 20%;
    position: relative; width: 100%; aspect-ratio: 1.586 / 1; border-radius: 18px;
    padding: clamp(16px, 5vw, 22px) clamp(18px, 5.5vw, 24px); color: #f6f1e4; overflow: hidden; isolation: isolate;
    display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(140% 100% at var(--mx) var(--my), rgba(255,255,255,0.20), transparent 50%),
      linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -1px 0 rgba(0,0,0,0.35),
      0 0 0 1px rgba(0,0,0,0.25), 0 30px 50px -24px rgba(0,0,0,0.85);
    transform: rotateX(var(--rx)) rotateY(var(--ry)); transition: transform .4s ease; }
  .card-holder { perspective: 1000px; }
  .pcard.tilting { transition: transform .08s linear; }
  .pcard::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      repeating-radial-gradient(circle at 115% 120%, transparent 0 9px, rgba(255,255,255,0.055) 9px 10px),
      repeating-linear-gradient(115deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 6px); }
  .pcard.enter::after { content: ""; position: absolute; inset: -40% -60%; z-index: 1; pointer-events: none;
    background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,0.22) 50%, transparent 58%);
    transform: translateX(-70%); animation: sheen 1.4s .1s ease-out both; }
  @keyframes sheen { to { transform: translateX(70%); } }
  .pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .pc-note { font-size: clamp(10.5px, 3vw, 12px); color: rgba(246,241,228,0.72); max-width: 45%; line-height: 1.3; }
  .pc-name { font-size: clamp(16px, 4.8vw, 20px); font-weight: 700; letter-spacing: -0.01em; text-align: right; line-height: 1.15;
    text-shadow: 0 1px 1px rgba(0,0,0,0.35); max-width: 60%; overflow-wrap: anywhere; }
  .pc-mid { display: flex; align-items: center; gap: clamp(12px, 4vw, 18px); }
  .pc-chip { width: clamp(38px, 11vw, 46px); flex-shrink: 0; filter: drop-shadow(0 1px 1px rgba(0,0,0,0.4)); }
  .pc-wave { width: 18px; opacity: 0.8; flex-shrink: 0; }
  .pc-days { margin-left: auto; text-align: right; line-height: 1; }
  .pc-days b { font-weight: 800; font-size: clamp(42px, 13.5vw, 58px); letter-spacing: -0.04em; text-shadow: 0 2px 2px rgba(0,0,0,0.35); font-variant-numeric: tabular-nums; }
  .pc-days small { display: block; font-size: clamp(10.5px, 3vw, 12px); color: rgba(246,241,228,0.78); margin-top: 4px; font-weight: 500; }
  .pc-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .pc-fields { display: flex; gap: clamp(14px, 5vw, 24px); }
  .pc-field { font-size: clamp(7.5px, 2.2vw, 9px); letter-spacing: 0.14em; text-transform: uppercase; color: rgba(246,241,228,0.62); font-weight: 600; }
  .pc-field div { font-family: var(--mono); font-size: clamp(12px, 3.6vw, 15px); letter-spacing: 0.08em; color: #f6f1e4; margin-top: 2px; font-weight: 600;
    text-shadow: 0 1px 0 rgba(0,0,0,0.55), 0 -1px 0 rgba(255,255,255,0.18); text-transform: none; }
  .pc-avail { text-align: right; }

  .limit { margin-top: 14px; font-size: 13px; color: var(--stage-muted); }
  .limit .row-x { display: flex; justify-content: space-between; gap: 10px; }
  .limit strong { color: var(--stage-ink); font-weight: 600; }
  .meter { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 7px; }
  .stage .meter { background: var(--stage-line); }
  .meter i { display: block; height: 100%; border-radius: 3px; transition: width .3s ease; }
  .alert { margin-top: 10px; font-size: 13px; color: #f2b0a7; font-weight: 600; }

  /* day strip */
  .strip { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; margin: 20px -16px 0; padding: 2px 16px 6px;
    scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .day { flex: 0 0 auto; width: 58px; scroll-snap-align: center; border: 1px solid var(--stage-line); background: rgba(255,255,255,0.04);
    color: var(--stage-ink); border-radius: 14px; padding: 8px 0 9px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  .day:hover { border-color: rgba(255,255,255,0.3); }
  .day .dw { font-size: 11.5px; color: var(--stage-muted); }
  .day .dn { font-size: 19px; font-weight: 700; line-height: 1.2; }
  .day .df { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; color: var(--stage-muted); }
  .day .df::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tier); }
  .day[aria-pressed="true"] { background: var(--brass); border-color: var(--brass); color: #1a1408; }
  .day[aria-pressed="true"] .dw, .day[aria-pressed="true"] .df { color: rgba(26,20,8,0.75); }
  .tier-1 { --tier: #6fd0a6; } .tier-2 { --tier: #e2c27a; } .tier-3 { --tier: #ee8f84; }

  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .ctl { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--stage-muted); }
  .stage input[type] { background: rgba(255,255,255,0.06); border-color: var(--stage-line); color: var(--stage-ink); color-scheme: dark; }
  .stage input::placeholder { color: rgba(238,241,244,0.4); }

  /* ---------- inputs & buttons ---------- */
  input[type="date"], input[type="number"], input[type="text"], select {
    width: 100%; min-width: 0; height: 44px; font-size: 15px; border: 1px solid var(--line); background: var(--surface);
    padding: 0 12px; border-radius: 10px; -webkit-appearance: none; appearance: none; }
  select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 17px) 52%, calc(100% - 12px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
  input:focus, select:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 30%, transparent); }
  input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--ink); margin: 0; }

  .btn { height: 44px; padding: 0 18px; border-radius: 10px; border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
    font-weight: 600; font-size: 14.5px; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.12); }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--ink); filter: none; }
  .btn.danger { background: transparent; color: var(--due); border-color: color-mix(in srgb, var(--due) 45%, transparent); }
  .pill { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .pill:hover { border-color: var(--ink); }
  .pill.done { border-color: transparent; background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
  .textbtn { background: none; border: none; padding: 6px 2px; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .textbtn:hover { color: var(--ink); }
  .textbtn.danger { color: var(--due); }

  /* ---------- blocks & grouped lists ---------- */
  .block { margin-bottom: 26px; }
  .block-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 4px 10px; }
  h2 { font-size: 18px; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
  .block-head p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .group { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 16px; overflow: hidden;
    box-shadow: 0 0 0 1px var(--line); }
  .item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 13px 14px; position: relative; }
  .item + .item::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; border-top: 1px solid var(--line); }
  .item .name { font-weight: 600; overflow-wrap: anywhere; }
  .item .meta { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .item .end { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .item .amt { font-weight: 700; white-space: nowrap; }
  .item.dim { opacity: 0.5; }
  .empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }
  .late { color: var(--due); font-weight: 600; }
  .soon { color: var(--warn); font-weight: 600; }

  .sw { width: 28px; height: 19px; border-radius: 4px; flex-shrink: 0; display: block;
    background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14), 0 1px 2px rgba(0,0,0,0.2); }

  /* ranking */
  .rank .days { text-align: right; line-height: 1; }
  .rank .days b { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; }
  .rank .days small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  .fbar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .fbar i { display: block; height: 100%; border-radius: 2px; }
  .c-ink { color: var(--ink); } .b-ink { background: color-mix(in srgb, var(--ink) 45%, transparent); }
  .c-good { color: var(--good); } .c-warn { color: var(--warn); } .c-due { color: var(--due); }
  .b-good { background: var(--good); } .b-warn { background: var(--warn); } .b-due { background: var(--due); }

  /* ---------- panels / forms ---------- */
  .panel { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: 0 0 0 1px var(--line); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
  .full { grid-column: 1 / -1; }
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field > label, .lbl { font-size: 13px; color: var(--muted); font-weight: 500; }
  .check { display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer; }
  .hint { font-size: 13.5px; color: var(--muted); margin: 14px 0; min-height: 20px; }
  .hint strong { color: var(--ink); }

  /* ---------- calendar ---------- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 12px; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
    display: grid; place-items: center; font-size: 18px; line-height: 1; }
  .round:hover { border-color: var(--ink); }
  .cal { background: var(--surface); border-radius: 16px; padding: 12px; box-shadow: 0 0 0 1px var(--line); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .cal-dow { font-size: 11.5px; color: var(--muted); text-align: center; padding: 2px 0 6px; font-weight: 600; }
  .cal-cell { min-height: 60px; border: none; border-radius: 10px; padding: 6px 5px; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; background: var(--t2); color: var(--ink); }
  .cal-cell.t1 { background: var(--t1); } .cal-cell.t3 { background: var(--t3); }
  .cal-cell:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .cal-cell.blank { background: none; cursor: default; box-shadow: none; }
  .cal-cell.past { opacity: 0.45; }
  .cal-cell.is-today { box-shadow: inset 0 0 0 2px var(--brass); }
  .cal-cell .d { font-size: 13px; font-weight: 700; }
  .cal-cell .c { font-size: 10.5px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted); }
  .cal-cell .dot { position: absolute; top: 7px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--due); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--muted); margin: 12px 4px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .legend i.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--due); }

  /* ---------- cards tab ---------- */
  .editor { background: var(--surface); border-radius: 16px; padding: 16px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 14px; }
  .editor-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .mini { width: 84px; flex-shrink: 0; aspect-ratio: 1.586 / 1; border-radius: 8px; padding: 7px 8px; position: relative;
    background: linear-gradient(135deg, var(--c1), var(--c2)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.25), 0 6px 14px -8px rgba(0,0,0,0.6); }
  .mini::before { content: ""; position: absolute; left: 8px; top: 50%; width: 15px; height: 11px; margin-top: -5px; border-radius: 2.5px;
    background: linear-gradient(135deg, #f3dc9b, #c9a24f); }
  .editor-head .name-in { flex: 1; min-width: 0; height: 40px; font-size: 17px; font-weight: 700; border-color: transparent; padding: 0 8px; margin-left: -8px; }
  .editor-head .name-in:hover { border-color: var(--line); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatches label { cursor: pointer; display: block; }
  .swatches input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .swatches .sw { width: 30px; height: 20px; border-radius: 5px; }
  .swatches input:checked + .sw { outline: 2px solid var(--ink); outline-offset: 2px; }
  .swatches input:focus-visible + .sw { outline: 2px solid var(--brass); outline-offset: 2px; }
  .editor .status { font-size: 13px; color: var(--muted); margin-top: 14px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }

  .foot { font-size: 12.5px; color: var(--muted); line-height: 1.6; margin-top: 8px; }
  .foot .warn-text { color: var(--due); font-weight: 600; }

  /* ---------- tab bar ---------- */
  .tabbar { position: fixed; z-index: 10; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom));
    width: min(calc(100% - 24px), 440px); display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px;
    background: color-mix(in srgb, var(--stage) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 20px; box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 16px 32px -12px rgba(0,0,0,0.55); }
  .tabbar button { border: none; background: none; color: var(--stage-muted); cursor: pointer; border-radius: 14px; padding: 7px 0 6px;
    display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; font-weight: 600; position: relative; }
  .tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button[aria-selected="true"] { color: var(--brass); background: rgba(255,255,255,0.07); }
  .badge { position: absolute; top: 3px; left: calc(50% + 6px); min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px;
    background: var(--due); color: #fff; font-size: 10.5px; line-height: 17px; font-weight: 700; }

  /* ---------- toast ---------- */
  .toast { position: fixed; z-index: 20; left: 50%; bottom: calc(max(12px, env(safe-area-inset-bottom)) + 80px);
    transform: translate(-50%, 16px); opacity: 0; visibility: hidden; transition: transform .25s ease, opacity .25s ease, visibility .25s;
    background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 12px; font-size: 14px; display: flex; gap: 16px; align-items: center;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.5); max-width: calc(100vw - 32px); }
  .toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; }
  .toast button { background: none; border: none; color: var(--brass); font-weight: 700; cursor: pointer; padding: 0; }

  @media (max-width: 420px) {
    .item .hide-sm { display: none; }
    .cal-cell { min-height: 52px; padding: 5px 4px; }
    .cal-cell .c { font-size: 9.5px; }
  }
  .card-holder { max-width: 480px; }
  @media (min-width: 900px) {
    .top .wrap { max-width: 980px; }
    .stage .wrap { max-width: 980px; display: grid; grid-template-columns: 440px 1fr; column-gap: 56px; align-items: center; padding-top: 8px; padding-bottom: 12px; }
    #stageTop { grid-row: 1 / span 2; }
    .strip { grid-column: 2; align-self: end; flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
    .controls { grid-column: 2; align-self: start; margin-top: 18px; }
    .planner-lower { max-width: 980px; display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; }
    .planner-lower > :only-child { grid-column: 1 / -1; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
    .pcard.enter::after { display: none; }
  }
</style>
</head>
<body data-tab="planner">
<header class="top">
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 26 18" aria-hidden="true"><rect x=".5" y=".5" width="25" height="17" rx="3.5" fill="none" stroke="#c29b52"/><rect x="4" y="6" width="6" height="5" rx="1" fill="#c29b52"/></svg>Card Float</div>
    <div class="today" id="todayLabel"></div>
  </div>
</header>
<main id="tabbody"></main>
<footer class="wrap foot" id="foot"></footer>
<nav class="tabbar" id="nav" role="tablist" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';

/* =========================================================
   Storage & state
   ========================================================= */
const STORAGE_KEY = 'cardFloatPlanner.v2';
// Card finishes: [label, gradient start, gradient end]
const FINISHES = {
  midnight: ['Midnight', '#22345a', '#0a1020'],
  burgundy: ['Burgundy', '#7a2236', '#2a0912'],
  emerald:  ['Emerald',  '#17664f', '#05231b'],
  ocean:    ['Ocean',    '#14607e', '#051f2c'],
  royal:    ['Royal',    '#43318a', '#120b30'],
  copper:   ['Copper',   '#9a5530', '#2c1409'],
  graphite: ['Graphite', '#474b55', '#101115'],
  gold:     ['Gold',     '#a8823a', '#3d2c0c'],
};
const FINISH_KEYS = Object.keys(FINISHES);
function finishVars(card) { const f = FINISHES[card.color] || FINISHES.midnight; return `--c1:${f[1]};--c2:${f[2]}`; }
function hashFinish(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return FINISH_KEYS[h % FINISH_KEYS.length]; }

const DEFAULT_CARDS = [
  { id: 'myzone',     name: 'Axis Myzone',     note: 'RuPay UPI',                  billingDay: 12, grace: 20, limit: 50000,  balance: 0, color: 'burgundy' },
  { id: 'neo',        name: 'Axis Neo',        note: '',                           billingDay: 13, grace: 20, limit: 50000,  balance: 0, color: 'ocean' },
  { id: 'simply',     name: 'SBI SimplyClick', note: '',                           billingDay: 16, grace: 19, limit: 100000, balance: 0, color: 'royal' },
  { id: 'simplysave', name: 'SBI SimplySave',  note: 'RuPay UPI',                  billingDay: 16, grace: 19, limit: 50000,  balance: 0, color: 'emerald' },
  { id: 'rbl',        name: 'RBL',             note: '',                           billingDay: 17, grace: 20, limit: 100000, balance: 0, color: 'graphite' },
  { id: 'privilege',  name: 'Axis Privilege',  note: '',                           billingDay: 18, grace: 20, limit: 150000, balance: 0, color: 'midnight' },
  { id: 'slice',      name: 'Slice',           note: 'RuPay UPI, shortest grace',  billingDay: 21, grace: 14, limit: 30000,  balance: 0, color: 'copper' },
];

let storageOk = true;
const state = loadState();
const ui = {
  tab: 'planner',
  plannerDate: toKey(today()),
  plannerAmount: '',
  calY: today().getFullYear(),
  calM: today().getMonth(),
  filter: 'all',
};

function freshState() {
  return { cards: DEFAULT_CARDS.map(c => ({ ...c })), purchases: [], paid: {} };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return sanitizeState(JSON.parse(raw));
  } catch (e) { storageOk = false; }
  return freshState();
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 2, ...state }));
    storageOk = true;
  } catch (e) { storageOk = false; }
  renderFoot();
}

function clampInt(v, min, max, fallback) {
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? Math.min(max, Math.max(min, n)) : fallback;
}
function posNum(v) { const n = parseFloat(v); return Number.isFinite(n) && n > 0 ? n : 0; }
function uid() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function sanitizeCard(c) {
  return {
    id: String(c && c.id || uid()).replace(/\|/g, ''),
    name: String(c && c.name || 'Card').trim().slice(0, 40) || 'Card',
    note: String(c && c.note || '').trim().slice(0, 60),
    billingDay: clampInt(c && c.billingDay, 1, 31, 1),
    grace: clampInt(c && c.grace, 0, 60, 20),
    limit: posNum(c && c.limit),
    balance: posNum(c && c.balance),
    color: FINISHES[c && c.color] ? c.color : hashFinish(c && c.id),
  };
}

function sanitizeState(d) {
  if (!d || !Array.isArray(d.cards)) throw new Error('Not a planner backup');
  const cards = d.cards.map(sanitizeCard);
  const ids = new Set(cards.map(c => c.id));
  const purchases = (Array.isArray(d.purchases) ? d.purchases : [])
    .filter(p => p && ids.has(p.cardId) && /^\d{4}-\d{2}-\d{2}$/.test(p.date) && posNum(p.amount) > 0)
    .map(p => ({
      id: String(p.id || uid()), cardId: p.cardId, date: p.date, amount: posNum(p.amount),
      isEMI: !!p.isEMI, installment: posNum(p.installment || p.installmentAmount),
      note: String(p.note || '').slice(0, 80),
    }));
  const paid = {};
  if (d.paid && typeof d.paid === 'object') {
    Object.keys(d.paid).forEach(k => { if (d.paid[k] && ids.has(k.split('|')[0])) paid[k] = true; });
  }
  return { cards, purchases, paid };
}

/* =========================================================
   Date helpers — all local time, never toISOString()
   (toISOString is UTC and shifts the date before 5:30 AM in IST)
   ========================================================= */
const DAY = 86400000;
function pad(n) { return String(n).padStart(2, '0'); }
function toKey(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function fromKey(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function today() { const t = new Date(); t.setHours(0, 0, 0, 0); return t; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function diffDays(a, b) { return Math.round((a - b) / DAY); }
function fmt(d) { return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtShort(d) { return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }); }
function inr(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function plural(n, w) { return `${n} ${w}${n === 1 ? '' : 's'}`; }
function inDays(n) { return n === 0 ? 'today' : n === 1 ? 'tomorrow' : n > 0 ? `in ${n} days` : `${plural(-n, 'day')} ago`; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* =========================================================
   Billing-cycle math
   ========================================================= */
// Statement date in a given month; billing day 31 becomes the last day in short months.
function closeIn(card, y, m) {
  const dim = new Date(y, m + 1, 0).getDate();
  return new Date(y, m, Math.min(card.billingDay, dim));
}

// Which statement a spend on date `d` lands in (spends on the statement day are included).
function cycleFor(card, d) {
  let close = closeIn(card, d.getFullYear(), d.getMonth());
  if (d > close) close = closeIn(card, d.getFullYear(), d.getMonth() + 1);
  const due = addDays(close, card.grace);
  return { close, due, days: diffDays(due, d) };
}

// Most recent statement already generated before `t`.
function lastClosed(card, t) {
  const c = closeIn(card, t.getFullYear(), t.getMonth());
  return c < t ? c : closeIn(card, t.getFullYear(), t.getMonth() - 1);
}

function stmtKey(cardId, close) { return cardId + '|' + toKey(close); }
function isPaid(cardId, close) { return !!state.paid[stmtKey(cardId, close)]; }
function cardById(id) { return state.cards.find(c => c.id === id); }

// EMI: one installment per statement, starting with the statement the purchase lands in.
function emiSchedule(p, card) {
  const inst = p.installment > 0 ? Math.min(p.installment, p.amount) : p.amount;
  const n = Math.max(1, Math.ceil(p.amount / inst - 1e-9));
  const first = cycleFor(card, fromKey(p.date)).close;
  const out = [];
  for (let k = 0; k < n; k++) {
    out.push({
      close: closeIn(card, first.getFullYear(), first.getMonth() + k),
      amount: k < n - 1 ? inst : p.amount - inst * (n - 1),
    });
  }
  return out;
}

function purchasesOf(cardId) { return state.purchases.filter(p => p.cardId === cardId); }

// Amount billed on the statement that closes on `close`.
function statementAmount(card, close) {
  const key = toKey(close);
  return purchasesOf(card.id).reduce((sum, p) => {
    if (p.isEMI) return sum + emiSchedule(p, card).filter(e => toKey(e.close) === key).reduce((s, e) => s + e.amount, 0);
    return toKey(cycleFor(card, fromKey(p.date)).close) === key ? sum + p.amount : sum;
  }, 0);
}

// Limit blocked right now: opening balance + unpaid spends + unpaid EMI principal.
function usedLimit(card) {
  return purchasesOf(card.id).reduce((sum, p) => {
    if (p.isEMI) return sum + emiSchedule(p, card).filter(e => !isPaid(card.id, e.close)).reduce((s, e) => s + e.amount, 0);
    return isPaid(card.id, cycleFor(card, fromKey(p.date)).close) ? sum : sum + p.amount;
  }, card.balance);
}
function available(card) { return card.limit ? card.limit - usedLimit(card) : Infinity; }
function utilPct(card) { return card.limit ? Math.min(100, Math.round(usedLimit(card) / card.limit * 100)) : 0; }
function utilClass(pct) { return pct >= 80 ? 'low' : pct >= 50 ? 'mid' : 'good'; }

// Statements already generated whose payment is upcoming (or overdue and unpaid).
function pendingStatements() {
  const t = today();
  return state.cards.map(card => {
    const close = lastClosed(card, t);
    const due = addDays(close, card.grace);
    return {
      card, close, due, key: stmtKey(card.id, close),
      amount: statementAmount(card, close),
      paid: isPaid(card.id, close),
      daysTo: diffDays(due, t),
    };
  }).filter(s => s.daysTo >= 0 || (!s.paid && s.amount > 0))
    .sort((a, b) => (a.paid - b.paid) || (a.daysTo - b.daysTo));
}
function urgentStatements() { return pendingStatements().filter(s => !s.paid && s.daysTo <= 5); }

function rankCards(date, amount) {
  const av = x => (x.avail === Infinity ? 1e15 : x.avail);
  return state.cards.map(card => {
    const avail = available(card);
    return { card, ...cycleFor(card, date), avail, fits: !amount || avail >= amount };
  }).sort((a, b) => (b.fits - a.fits) || (b.days - a.days) || (av(b) - av(a)));
}

function shortName(name) { return name.replace(/^(Axis|SBI|HDFC|ICICI|Kotak|AU|IDFC|Yes|IndusInd)\s+/i, ''); }

/* =========================================================
   Rendering
   ========================================================= */
const ICONS = {
  planner: '<svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6 15h4"/></svg>',
  calendar: '<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  spends: '<svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12h6"/></svg>',
  cards: '<svg viewBox="0 0 24 24"><rect x="5.5" y="3" width="13" height="18" rx="2.5"/><path d="M9 7h6"/><circle cx="12" cy="15" r="2.2"/></svg>',
};
const TABS = [['planner', 'Planner'], ['calendar', 'Calendar'], ['spends', 'Spends'], ['cards', 'Cards']];

function render() {
  document.body.dataset.tab = ui.tab;
  document.getElementById('todayLabel').textContent = today().toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
  renderNav();
  renderTab();
  renderFoot();
}

function renderNav() {
  const urgent = urgentStatements().length;
  document.getElementById('nav').innerHTML = TABS.map(([id, label]) => `
    <button role="tab" data-action="tab" data-tab="${id}" aria-selected="${ui.tab === id}">
      ${ICONS[id]}${label}${id === 'spends' && urgent ? `<span class="badge" aria-label="${plural(urgent, 'payment')} due soon">${urgent}</span>` : ''}
    </button>`).join('');
}

function renderTab() {
  const body = document.getElementById('tabbody');
  if (ui.tab === 'planner') { body.innerHTML = renderPlanner(); scrollStrip(); }
  if (ui.tab === 'calendar') body.innerHTML = renderCalendar();
  if (ui.tab === 'spends') body.innerHTML = renderSpends();
  if (ui.tab === 'cards') body.innerHTML = renderCards();
}

function renderFoot() {
  document.getElementById('foot').innerHTML = storageOk
    ? 'Saved on this device only. Export a backup from Cards to move your data or keep it safe.'
    : '<span class="warn-text">This browser is blocking storage, so changes will be lost when you close the tab. Export a backup from Cards.</span>';
}

function emptyCards() {
  return `<div class="wrap"><div class="panel empty">Add a card to start planning. <button class="textbtn" data-action="tab" data-tab="cards">Add a card</button></div></div>`;
}

function tier(days) { return days >= 35 ? 1 : days >= 20 ? 2 : 3; }
function dayLabel(d) {
  const n = diffDays(d, today());
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  return d.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' });
}

/* ---------- Planner ---------- */
const CHIP_SVG = `<svg class="pc-chip" viewBox="0 0 46 34" aria-hidden="true"><defs><linearGradient id="chipG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3dc9b"/><stop offset=".5" stop-color="#c9a24f"/><stop offset="1" stop-color="#e8cd85"/></linearGradient></defs><rect x=".5" y=".5" width="45" height="33" rx="6" fill="url(#chipG)" stroke="#8a6a28" stroke-opacity=".6"/><g fill="none" stroke="#7d5f22" stroke-opacity=".55" stroke-width="1.1"><path d="M0 11.5h14M0 22.5h14M32 11.5h14M32 22.5h14M14 0v34M32 0v34"/><rect x="14" y="8" width="18" height="18" rx="3"/></g></svg>`;
const WAVE_SVG = `<svg class="pc-wave" viewBox="0 0 18 24" aria-hidden="true" fill="none" stroke="#f6f1e4" stroke-width="1.8" stroke-linecap="round"><path d="M3 8.5a5 5 0 0 1 0 7"/><path d="M7.5 5.5a10 10 0 0 1 0 13"/><path d="M12 2.5a15 15 0 0 1 0 19"/></svg>`;
function cardDate(d) { return `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)}`; }
let lastCardShown = null;

function renderPlanner() {
  if (!state.cards.length) return emptyCards();
  return `
    <section class="stage">
      <div class="wrap">
        <div id="stageTop">${renderStageTop()}</div>
        <div class="strip" id="strip" aria-label="Choose a day">${renderStrip()}</div>
        <div class="controls">
          <label class="ctl">Amount (optional)<input type="number" id="planAmount" inputmode="decimal" min="0" placeholder="₹" value="${esc(ui.plannerAmount)}"></label>
          <label class="ctl">Another date<input type="date" id="spendDate" value="${ui.plannerDate}"></label>
        </div>
      </div>
    </section>
    <div class="wrap planner-lower">
      ${renderDueSoon()}
      <section class="block" id="rankBlock">${renderRank()}</section>
    </div>`;
}

function renderStageTop() {
  const date = fromKey(ui.plannerDate);
  const amount = posNum(ui.plannerAmount);
  const top = rankCards(date, amount)[0];
  const noneFit = amount && !top.fits;
  const pct = utilPct(top.card);
  const animate = lastCardShown !== top.card.id + ui.plannerDate;
  lastCardShown = top.card.id + ui.plannerDate;
  return `
    <h1 class="stage-title">Use ${esc(top.card.name)}<span>Best card for ${amount ? `a ${inr(amount)} spend ` : ''}${dayLabel(date)}</span></h1>
    <div class="card-holder" aria-live="polite">
      <div class="pcard ${animate ? 'enter' : ''}" style="${finishVars(top.card)}" role="img"
        aria-label="${esc(top.card.name)}: ${top.days} days interest-free, statement ${fmt(top.close)}, pay by ${fmt(top.due)}">
        <div class="pc-top">
          <div class="pc-note">${esc(top.card.note)}</div>
          <div class="pc-name">${esc(top.card.name)}</div>
        </div>
        <div class="pc-mid">
          ${CHIP_SVG}${WAVE_SVG}
          <div class="pc-days"><b>${top.days}</b><small>days interest-free</small></div>
        </div>
        <div class="pc-bottom">
          <div class="pc-fields">
            <div class="pc-field">Statement<div>${cardDate(top.close)}</div></div>
            <div class="pc-field">Pay by<div>${cardDate(top.due)}</div></div>
          </div>
          ${top.avail !== Infinity ? `<div class="pc-field pc-avail">Available<div>${inr(Math.max(0, top.avail))}</div></div>` : ''}
        </div>
      </div>
    </div>
    ${top.avail !== Infinity ? `
      <div class="limit">
        <div class="row-x"><span><strong class="num">${inr(usedLimit(top.card))}</strong> used of ${inr(top.card.limit)}</span><span class="num">${pct}%</span></div>
        <div class="meter"><i class="b-${meterTone(pct)}" style="width:${pct}%"></i></div>
      </div>` : ''}
    ${noneFit ? `<div class="alert">No card has ${inr(amount)} of free limit. Try splitting the spend across two cards.</div>` : ''}
    ${!noneFit && top.avail < 0 ? `<div class="alert">This card is over its limit on logged spends.</div>` : ''}`;
}
function meterTone(pct) { return pct >= 80 ? 'due' : pct >= 50 ? 'warn' : 'good'; }

function renderStrip() {
  const t = today();
  const amount = posNum(ui.plannerAmount);
  let html = '';
  for (let i = 0; i < 21; i++) {
    const d = addDays(t, i);
    const top = rankCards(d, amount)[0];
    const key = toKey(d);
    html += `<button class="day tier-${tier(top.days)}" data-action="pick-day" data-date="${key}" aria-pressed="${key === ui.plannerDate}"
      aria-label="${esc(fmt(d))}: ${esc(top.card.name)}, ${top.days} days">
      <span class="dw">${i === 0 ? 'Today' : d.toLocaleDateString('en-IN', { weekday: 'short' })}</span>
      <span class="dn">${d.getDate()}</span><span class="df num">${top.days}d</span></button>`;
  }
  return html;
}
function scrollStrip() {
  const sel = document.querySelector('.day[aria-pressed="true"]');
  if (sel) sel.scrollIntoView({ block: 'nearest', inline: 'center' });
}

function renderDueSoon() {
  const list = urgentStatements();
  if (!list.length) return '';
  return `
    <section class="block">
      <div class="block-head"><div><h2>Due soon</h2><p>Bills already generated, due in the next 5 days</p></div>
        <button class="textbtn" data-action="tab" data-tab="spends" style="white-space:nowrap">All payments</button></div>
      <ul class="group">${list.map(paymentItem).join('')}</ul>
    </section>`;
}

function dueText(s) {
  if (s.daysTo < 0) return `<span class="late">Overdue by ${plural(-s.daysTo, 'day')}</span>`;
  const when = s.daysTo === 0 ? 'Due today' : s.daysTo === 1 ? 'Due tomorrow' : `Due ${s.due.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' })}`;
  return s.daysTo <= 2 && !s.paid ? `<span class="soon">${when}</span>` : when;
}

function paymentItem(s) {
  return `<li class="item">
    <i class="sw" style="${finishVars(s.card)}"></i>
    <div><div class="name">${esc(s.card.name)}</div><div class="meta">${dueText(s)}</div></div>
    <div class="end">${s.amount ? `<span class="amt num">${inr(s.amount)}</span>` : ''}
      <button class="pill ${s.paid ? 'done' : ''}" data-action="toggle-paid" data-key="${esc(s.key)}" aria-pressed="${s.paid}">${s.paid ? 'Paid ✓' : 'Mark paid'}</button></div>
  </li>`;
}

function renderRank() {
  const date = fromKey(ui.plannerDate);
  const amount = posNum(ui.plannerAmount);
  const results = rankCards(date, amount);
  const max = Math.max(...results.map(r => r.days));
  const scale = Math.max(max, 1);
  return `
    <div class="block-head"><div><h2>All cards</h2><p>Interest-free days for a spend ${dayLabel(date) === 'today' || dayLabel(date) === 'tomorrow' ? dayLabel(date) : 'on ' + fmtShort(date)}</p></div></div>
    <ul class="group rank">
      ${results.map(r => {
        const tone = r.days === max ? 'good' : r.days >= max - 7 ? 'ink' : 'due';
        return `<li class="item ${r.fits ? '' : 'dim'}">
          <i class="sw" style="${finishVars(r.card)}"></i>
          <div><div class="name">${esc(r.card.name)}</div>
            <div class="meta">${r.fits ? `Pay by ${fmtShort(r.due)}<span class="hide-sm">, statement ${fmtShort(r.close)}</span>` : 'Not enough free limit'}</div>
            <div class="fbar"><i class="b-${tone}" style="width:${Math.round(r.days / scale * 100)}%"></i></div></div>
          <div class="days"><b class="num c-${tone}">${r.days}</b><small>days</small></div>
        </li>`;
      }).join('')}
    </ul>`;
}

/* ---------- Calendar ---------- */
function dueDatesInMonth(y, m) {
  const map = {};
  state.cards.forEach(card => {
    for (let k = -3; k <= 0; k++) {
      const due = addDays(closeIn(card, y, m + k), card.grace);
      if (due.getFullYear() === y && due.getMonth() === m) (map[due.getDate()] = map[due.getDate()] || []).push(card);
    }
  });
  return map;
}

function renderCalendar() {
  if (!state.cards.length) return emptyCards();
  const y = ui.calY, m = ui.calM, t = today();
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const dues = dueDatesInMonth(y, m);
  const isThisMonth = y === t.getFullYear() && m === t.getMonth();

  let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += `<div class="cal-cell blank" aria-hidden="true"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const date = new Date(y, m, d);
    const top = rankCards(date, 0)[0];
    const dueCards = dues[d] || [];
    const cmp = diffDays(date, t);
    const label = `${fmt(date)}: ${top.card.name}, ${top.days} days${dueCards.length ? '. Due: ' + dueCards.map(c => c.name).join(', ') : ''}`;
    cells += `<button class="cal-cell t${tier(top.days)} ${cmp === 0 ? 'is-today' : cmp < 0 ? 'past' : ''}" data-action="cal-day" data-date="${toKey(date)}" title="${esc(label)}" aria-label="${esc(label)}">
      <span class="d">${d}</span><span class="c">${esc(shortName(top.card.name))}</span><span class="c num">${top.days}d</span>
      ${dueCards.length ? '<span class="dot"></span>' : ''}</button>`;
  }

  const dueList = Object.keys(dues).map(Number).sort((a, b) => a - b).map(d => {
    const date = new Date(y, m, d);
    return dues[d].map(card => `<li class="item"><i class="sw" style="${finishVars(card)}"></i>
      <div><div class="name">${esc(card.name)}</div><div class="meta">${date.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'short' })}</div></div>
      <div class="end meta">${(n => n < 0 ? 'Passed' : n === 0 ? 'Today' : n === 1 ? 'Tomorrow' : 'In ' + n + ' days')(diffDays(date, t))}</div></li>`).join('');
  }).join('');

  return `<div class="wrap">
    <section class="block">
      <div class="cal-head">
        <button class="round" data-action="cal-move" data-dir="-1" aria-label="Previous month">‹</button>
        <div style="text-align:center"><h2>${first.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' })}</h2>
          ${isThisMonth ? '<p class="meta" style="margin:2px 0 0;font-size:13px;color:var(--muted)">Tap a day to plan it</p>' : '<button class="textbtn" data-action="cal-today">Back to this month</button>'}</div>
        <button class="round" data-action="cal-move" data-dir="1" aria-label="Next month">›</button>
      </div>
      <div class="cal"><div class="cal-grid">
        ${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div></div>
      <div class="legend">
        <span><i style="background:var(--t1)"></i>35+ days</span>
        <span><i style="background:var(--t2)"></i>20 to 34 days</span>
        <span><i style="background:var(--t3)"></i>Under 20</span>
        <span><i class="dot"></i>Payment due</span>
      </div>
    </section>
    <section class="block">
      <div class="block-head"><h2>Payment dates this month</h2></div>
      ${dueList ? `<ul class="group">${dueList}</ul>` : '<div class="group empty">No payments fall in this month.</div>'}
    </section></div>`;
}

/* ---------- Spends ---------- */
function renderSpends() {
  if (!state.cards.length) return emptyCards();
  const pend = pendingStatements();
  const t = today();
  const cardOptions = state.cards.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');

  const usage = state.cards.map(card => {
    const pct = utilPct(card);
    const next = cycleFor(card, t);
    const unbilled = statementAmount(card, next.close);
    return `<li class="item">
      <i class="sw" style="${finishVars(card)}"></i>
      <div><div class="name">${esc(card.name)}</div>
        <div class="meta">${inr(unbilled)} this cycle, bills ${fmtShort(next.close)}</div>
        ${card.limit ? `<div class="fbar"><i class="b-${meterTone(pct)}" style="width:${pct}%"></i></div>` : ''}</div>
      <div class="end"><span class="amt num">${inr(usedLimit(card))}</span><span class="meta num">${card.limit ? `of ${inr(card.limit)}` : 'No limit set'}</span></div>
    </li>`;
  }).join('');

  return `<div class="wrap">
    <section class="block">
      <div class="block-head"><div><h2>Payments</h2><p>Bills already generated</p></div></div>
      ${pend.length ? `<ul class="group">${pend.map(paymentItem).join('')}</ul>` : '<div class="group empty">Nothing to pay right now.</div>'}
    </section>

    <section class="block">
      <div class="block-head"><h2>Log a spend</h2></div>
      <div class="panel">
        <div class="form-grid">
          <div class="field"><label for="pAmount">Amount</label><input type="number" id="pAmount" inputmode="decimal" min="0" placeholder="₹"></div>
          <div class="field"><label for="pDate">Date</label><input type="date" id="pDate" value="${toKey(t)}"></div>
          <div class="field full"><label for="pCard">Card</label>
            <select id="pCard"><option value="__auto">Best card for this date</option>${cardOptions}</select></div>
          <div class="field full"><label for="pNote">Note (optional)</label><input type="text" id="pNote" maxlength="80" placeholder="Groceries, laptop…"></div>
          <label class="check full"><input type="checkbox" id="pEMI"> Converted to EMI</label>
          <div class="field full" id="emiField" hidden><label for="pInstallment">Monthly installment</label>
            <input type="number" id="pInstallment" inputmode="decimal" min="0" placeholder="₹ per month"></div>
        </div>
        <p class="hint" id="pSuggest">${suggestText()}</p>
        <button class="btn" data-action="add-purchase" style="width:100%">Add spend</button>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><h2>Logged spends</h2>
        <select id="filterCard" aria-label="Show spends for" style="width:auto;height:36px;font-size:13.5px">
          <option value="all">All cards</option>${state.cards.map(c => `<option value="${esc(c.id)}" ${ui.filter === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}
        </select></div>
      <div id="spendList">${renderSpendList()}</div>
    </section>

    <section class="block">
      <div class="block-head"><div><h2>Limit in use</h2><p>Unpaid spends, EMI balance and other dues</p></div></div>
      <ul class="group">${usage}</ul>
    </section></div>`;
}

function renderSpendList() {
  if (ui.filter !== 'all' && !cardById(ui.filter)) ui.filter = 'all';
  const list = state.purchases.filter(p => ui.filter === 'all' || p.cardId === ui.filter)
    .slice().sort((a, b) => b.date.localeCompare(a.date));
  if (!list.length) return '<div class="group empty">No spends yet. Log one above to track your limits and bill amounts.</div>';
  const t = today();
  return `<ul class="group">${list.map(p => {
    const card = cardById(p.cardId);
    const c = cycleFor(card, fromKey(p.date));
    let status;
    if (p.isEMI) {
      const sched = emiSchedule(p, card);
      status = `EMI ${inr(sched[0].amount)}/mo, ${sched.filter(e => isPaid(card.id, e.close)).length} of ${sched.length} paid`;
    } else if (isPaid(card.id, c.close)) status = 'Paid';
    else if (c.close >= t) status = `Not billed yet, pay by ${fmtShort(c.due)}`;
    else status = `Pay by ${fmtShort(c.due)}`;
    return `<li class="item">
      <i class="sw" style="${finishVars(card)}"></i>
      <div><div class="name">${p.note ? esc(p.note) : esc(card.name)}</div>
        <div class="meta">${p.note ? esc(card.name) + ', ' : ''}${fmtShort(fromKey(p.date))}. ${status}</div></div>
      <div class="end"><span class="amt num">${inr(p.amount)}</span>
        <button class="textbtn danger" data-action="del-purchase" data-id="${esc(p.id)}" aria-label="Remove ${inr(p.amount)} spend">Remove</button></div>
    </li>`;
  }).join('')}</ul>`;
}

function suggestText() {
  const dateEl = document.getElementById('pDate');
  const amtEl = document.getElementById('pAmount');
  const cardEl = document.getElementById('pCard');
  const dateStr = dateEl ? dateEl.value : toKey(today());
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr) || !state.cards.length) return '';
  const date = fromKey(dateStr);
  const amount = amtEl ? posNum(amtEl.value) : 0;
  if (cardEl && cardEl.value !== '__auto') {
    const card = cardById(cardEl.value);
    const c = cycleFor(card, date);
    const short = amount && available(card) < amount;
    return `<strong>${c.days} days</strong> interest-free on ${esc(card.name)}, pay by ${fmt(c.due)}.${short ? ' <span class="late">This is more than its free limit.</span>' : ''}`;
  }
  const top = rankCards(date, amount)[0];
  return `Goes on <strong>${esc(top.card.name)}</strong>: ${top.days} days interest-free, pay by ${fmt(top.due)}.${amount && !top.fits ? ' <span class="late">No card has enough free limit.</span>' : ''}`;
}

/* ---------- Cards ---------- */
function renderCards() {
  const cards = state.cards.map(card => `
    <div class="editor" data-cardid="${esc(card.id)}">
      <div class="editor-head">
        <div class="mini" style="${finishVars(card)}" aria-hidden="true"></div>
        <input type="text" class="name-in" data-field="name" value="${esc(card.name)}" maxlength="40" aria-label="Card name">
        <button class="textbtn danger" data-action="del-card" data-id="${esc(card.id)}">Delete</button>
      </div>
      <div class="form-grid">
        <div class="field"><label>Statement day</label><input type="number" data-field="billingDay" min="1" max="31" inputmode="numeric" value="${card.billingDay}"></div>
        <div class="field"><label>Days to pay</label><input type="number" data-field="grace" min="0" max="60" inputmode="numeric" value="${card.grace}"></div>
        <div class="field"><label>Credit limit</label><input type="number" data-field="limit" min="0" inputmode="decimal" value="${card.limit || ''}" placeholder="Optional"></div>
        <div class="field"><label>Other dues not logged</label><input type="number" data-field="balance" min="0" inputmode="decimal" value="${card.balance || ''}" placeholder="₹0"></div>
        <div class="field full"><label>Note</label><input type="text" data-field="note" maxlength="60" value="${esc(card.note)}" placeholder="RuPay UPI, lounge access…"></div>
        <div class="field full"><span class="lbl">Colour</span><div class="swatches" role="radiogroup" aria-label="Card colour">
          ${FINISH_KEYS.map(k => `<label title="${FINISHES[k][0]}"><input type="radio" name="col-${esc(card.id)}" data-field="color" value="${k}" ${card.color === k ? 'checked' : ''} aria-label="${FINISHES[k][0]}"><i class="sw" style="--c1:${FINISHES[k][1]};--c2:${FINISHES[k][2]}"></i></label>`).join('')}
        </div></div>
      </div>
      <div class="status">${cardStatus(card)}</div>
    </div>`).join('');

  return `<div class="wrap">
    <section class="block">
      <div class="block-head"><div><h2>Your cards</h2><p>Changes save as you go</p></div></div>
      ${cards || '<div class="group empty">No cards yet. Add your first one below.</div>'}
    </section>

    <section class="block">
      <div class="block-head"><h2>Add a card</h2></div>
      <div class="panel">
        <div class="form-grid">
          <div class="field full"><label for="nName">Card name</label><input type="text" id="nName" maxlength="40" placeholder="HDFC Millennia"></div>
          <div class="field"><label for="nBilling">Statement day</label><input type="number" id="nBilling" min="1" max="31" inputmode="numeric" placeholder="1 to 31"></div>
          <div class="field"><label for="nGrace">Days to pay</label><input type="number" id="nGrace" min="0" max="60" inputmode="numeric" value="20"></div>
          <div class="field"><label for="nLimit">Credit limit</label><input type="number" id="nLimit" min="0" inputmode="decimal" placeholder="Optional"></div>
          <div class="field"><label for="nNote">Note</label><input type="text" id="nNote" maxlength="60" placeholder="Optional"></div>
        </div>
        <button class="btn" data-action="add-card" style="width:100%;margin-top:16px">Add card</button>
      </div>
    </section>

    <section class="block">
      <div class="block-head"><div><h2>Backup</h2><p>Your data lives only in this browser</p></div></div>
      <div class="actions">
        <button class="btn ghost" data-action="export">Export backup</button>
        <button class="btn ghost" data-action="import">Import backup</button>
        <button class="btn danger" data-action="reset">Reset everything</button>
      </div>
    </section></div>`;
}

function cardStatus(card) {
  const next = cycleFor(card, today());
  const used = `${inr(usedLimit(card))} in use${card.limit ? ` of ${inr(card.limit)}` : ''}`;
  return `${used}. Next statement ${fmtShort(next.close)}, pay by ${fmtShort(next.due)}.`;
}

/* =========================================================
   Toast with undo
   ========================================================= */
let toastTimer, toastUndo;
function toast(msg, undo) {
  const el = document.getElementById('toast');
  toastUndo = undo || null;
  el.innerHTML = `<span>${msg}</span>${undo ? '<button data-action="undo">Undo</button>' : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); toastUndo = null; }, undo ? 6000 : 3000);
}

/* =========================================================
   Events (delegated)
   ========================================================= */
function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }
function refreshPlanner() {
  document.getElementById('stageTop').innerHTML = renderStageTop();
  document.getElementById('rankBlock').innerHTML = renderRank();
  document.querySelectorAll('.day').forEach(b => b.setAttribute('aria-pressed', b.dataset.date === ui.plannerDate));
  const di = document.getElementById('spendDate'); if (di && di.value !== ui.plannerDate) di.value = ui.plannerDate;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;

  if (a === 'tab') { ui.tab = t.dataset.tab; render(); window.scrollTo({ top: 0 }); }

  else if (a === 'pick-day') { ui.plannerDate = t.dataset.date; refreshPlanner(); t.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' }); }

  else if (a === 'cal-move') {
    const d = new Date(ui.calY, ui.calM + Number(t.dataset.dir), 1);
    ui.calY = d.getFullYear(); ui.calM = d.getMonth(); renderTab();
  }
  else if (a === 'cal-today') { ui.calY = today().getFullYear(); ui.calM = today().getMonth(); renderTab(); }
  else if (a === 'cal-day') { ui.plannerDate = t.dataset.date; ui.tab = 'planner'; render(); window.scrollTo({ top: 0 }); }

  else if (a === 'toggle-paid') {
    const k = t.dataset.key;
    const wasPaid = !!state.paid[k];
    if (wasPaid) delete state.paid[k]; else state.paid[k] = true;
    saveState(); render();
    if (!wasPaid) toast('Marked paid', () => { delete state.paid[k]; saveState(); render(); });
  }

  else if (a === 'add-purchase') addPurchase();

  else if (a === 'del-purchase') {
    const idx = state.purchases.findIndex(p => p.id === t.dataset.id);
    if (idx < 0) return;
    const [removed] = state.purchases.splice(idx, 1);
    saveState(); render();
    toast('Spend removed', () => { state.purchases.splice(idx, 0, removed); saveState(); render(); });
  }

  else if (a === 'add-card') addCard();

  else if (a === 'del-card') {
    const card = cardById(t.dataset.id);
    const n = purchasesOf(card.id).length;
    if (n && !confirm(`Delete ${card.name} and its ${plural(n, 'logged spend')}?`)) return;
    const snapshot = JSON.parse(JSON.stringify(state));
    state.cards = state.cards.filter(c => c.id !== card.id);
    state.purchases = state.purchases.filter(p => p.cardId !== card.id);
    Object.keys(state.paid).forEach(k => { if (k.startsWith(card.id + '|')) delete state.paid[k]; });
    saveState(); render();
    toast(`${esc(card.name)} deleted`, () => { Object.assign(state, snapshot); saveState(); render(); });
  }

  else if (a === 'export') exportData();
  else if (a === 'import') document.getElementById('importFile').click();
  else if (a === 'reset') {
    if (!confirm('Reset to the starting cards and delete all logged spends? Export a backup first if you might need them.')) return;
    Object.assign(state, freshState()); saveState(); render(); toast('Everything reset');
  }

  else if (a === 'undo' && toastUndo) {
    const fn = toastUndo; toastUndo = null;
    document.getElementById('toast').classList.remove('show');
    fn();
  }
});

document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'planAmount') {
    ui.plannerAmount = e.target.value;
    refreshPlanner();
    document.getElementById('strip').innerHTML = renderStrip();
  } else if (['pDate', 'pAmount', 'pCard'].includes(id)) {
    document.getElementById('pSuggest').innerHTML = suggestText();
  }
});

document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'spendDate') {
    if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { ui.plannerDate = el.value; refreshPlanner(); scrollStrip(); }
  } else if (el.id === 'pEMI') {
    document.getElementById('emiField').hidden = !el.checked;
  } else if (el.id === 'filterCard') {
    ui.filter = el.value; document.getElementById('spendList').innerHTML = renderSpendList();
  } else if (el.id === 'importFile') {
    importData(el.files[0]); el.value = '';
  } else if (el.dataset.field) {
    const wrap = el.closest('[data-cardid]');
    const card = cardById(wrap.dataset.cardid);
    Object.assign(card, sanitizeCard({ ...card, [el.dataset.field]: el.value }));
    if (el.type === 'number') el.value = card[el.dataset.field] || '';
    if (el.dataset.field === 'name') el.value = card.name;
    saveState();
    wrap.querySelector('.status').innerHTML = cardStatus(card);
    wrap.querySelector('.mini').setAttribute('style', finishVars(card));
    renderNav();
  }
});

if (window.matchMedia('(hover: hover) and (pointer: fine)').matches && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
  document.addEventListener('pointermove', e => {
    const card = e.target.closest && e.target.closest('.pcard');
    document.querySelectorAll('.pcard.tilting').forEach(c => { if (c !== card) resetTilt(c); });
    if (!card) return;
    const r = card.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    card.classList.add('tilting');
    card.style.setProperty('--ry', `${(x - 0.5) * 12}deg`);
    card.style.setProperty('--rx', `${(0.5 - y) * 10}deg`);
    card.style.setProperty('--mx', `${x * 100}%`);
    card.style.setProperty('--my', `${y * 100}%`);
  });
}
function resetTilt(c) { c.classList.remove('tilting'); ['--rx', '--ry', '--mx', '--my'].forEach(v => c.style.removeProperty(v)); }

function addPurchase() {
  const date = val('pDate');
  const amount = posNum(val('pAmount'));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return toast('Choose a date for the spend');
  if (!amount) { document.getElementById('pAmount').focus(); return toast('Enter the amount you spent'); }
  const isEMI = document.getElementById('pEMI').checked;
  const installment = posNum(val('pInstallment'));
  if (isEMI && !installment) { document.getElementById('pInstallment').focus(); return toast('Enter the monthly installment'); }

  let cardId = val('pCard');
  if (cardId === '__auto') cardId = rankCards(fromKey(date), amount)[0].card.id;
  const card = cardById(cardId);

  state.purchases.push({ id: uid(), cardId, date, amount, isEMI, installment: isEMI ? installment : 0, note: val('pNote').trim().slice(0, 80) });
  saveState();
  const c = cycleFor(card, fromKey(date));
  render();
  toast(`Spend added to ${esc(card.name)}, pay by ${fmtShort(c.due)}`);
}

function addCard() {
  const name = val('nName').trim();
  const billingDay = clampInt(val('nBilling'), 1, 31, 0);
  if (!name) { document.getElementById('nName').focus(); return toast('Enter the card’s name'); }
  if (!billingDay) { document.getElementById('nBilling').focus(); return toast('Enter the statement day, 1 to 31'); }
  state.cards.push(sanitizeCard({ id: uid(), name, billingDay, grace: val('nGrace'), limit: val('nLimit'), note: val('nNote') }));
  saveState(); render();
  toast(`${esc(name)} added`);
}

function exportData() {
  const blob = new Blob([JSON.stringify({ version: 2, exportedAt: new Date().toISOString(), ...state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `card-float-backup-${toKey(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup exported');
}

function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const next = sanitizeState(JSON.parse(reader.result));
      if (!confirm(`Replace your current data with this backup (${plural(next.cards.length, 'card')}, ${plural(next.purchases.length, 'spend')})?`)) return;
      Object.assign(state, next); saveState(); render(); toast('Backup imported');
    } catch (err) { toast('That file isn’t a Card Float backup'); }
  };
  reader.readAsText(file);
}

render();
</script>
</body>
</html>
